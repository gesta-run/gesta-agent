name: Agent Version Bump

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump agent rc version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Configure git author
        run: |
          git config user.name "Gesta Bot"
          git config user.email "bot@cloudpilot.ai"

      - name: Detect existing version bump
        id: existing
        run: |
          set -euo pipefail
          current="$(python3 -c 'import json; print(json.load(open("contracts/daemon.json"))["daemon_version"])')"
          previous="$(git show HEAD^:contracts/daemon.json 2>/dev/null | python3 -c 'import json,sys; data=sys.stdin.read(); print(json.loads(data)["daemon_version"] if data.strip() else "")' || true)"
          if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
            echo "Agent version already changed by merged PR: $previous -> $current"
            echo "already_bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
          else
            echo "already_bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump agent version
        id: bump
        if: steps.existing.outputs.already_bumped != 'true'
        run: |
          set -euo pipefail
          next_version="$(bash scripts/bump-agent-rc-version.sh)"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.existing.outputs.already_bumped != 'true'
        env:
          BUMP_BRANCH: automation/agent-version-bump
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No agent version change to commit."
            exit 0
          fi

          git add contracts/daemon.json pkg/model/contract_gen.go
          git commit -s -m "chore: bump agent version to ${{ steps.bump.outputs.version }}"
          git push --force origin HEAD:"$BUMP_BRANCH"

          pr_number="$(gh pr list --state open --head "$BUMP_BRANCH" --json number --jq '.[0].number // ""')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$BUMP_BRANCH" \
              --title "chore: bump agent version to ${{ steps.bump.outputs.version }}" \
              --body "Automated agent rc bump after merged PR #${{ github.event.pull_request.number }}."
            )"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" \
              --title "chore: bump agent version to ${{ steps.bump.outputs.version }}" \
              --body "Automated agent rc bump after merged PR #${{ github.event.pull_request.number }}."
          fi

          gh pr comment "$pr_number" --body "/approve"
