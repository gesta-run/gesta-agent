name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Run vet
        run: go vet ./...

      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.5.1
          go install golang.org/x/tools/cmd/deadcode@v0.24.0

      - name: Run static analysis
        run: |
          staticcheck ./...
          deadcode ./...

      - name: Test installer shell scripts
        run: |
          sh -n scripts/install.sh
          sh scripts/test-install-client-restart.sh

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build agent
        run: make build

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @("install-agent.ps1", "uninstall-agent.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "./scripts/$script"),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Run Windows platform tests
        run: |
          go test ./pkg/hookinstall -run TestQuoteCommandPathForWindows
          go test ./pkg/agentupgrade
          go test ./pkg/processutil
          go test ./pkg/atomicfile -run TestReplaceOverwritesExistingFileOnWindows
          go test ./pkg/eventqueue -run "TestQueueAppendAndDrain|TestQueueConcurrentDrainsCannotSendSameBatch"

      - name: Build Windows agent
        shell: bash
        env:
          GESTA_AGENT_TARGETS: windows/amd64
        run: ./scripts/build-agent-binaries.sh ./bin 0.0.0-ci

      - name: Test Windows install and uninstall
        shell: pwsh
        run: >-
          ./scripts/test-install-agent.ps1
          -BuiltAgent ./bin/gesta-agent-windows-amd64.exe
          -BuiltHook ./bin/gesta-agent-hook-launcher-windows-amd64.exe
