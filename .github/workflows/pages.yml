name: Publish Agent Assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Build published assets
        run: |
          mkdir -p _site/agent/bin
          cp scripts/install.sh _site/install-agent.sh
          cp scripts/install.sh _site/agent/install.sh
          scripts/build-agent-binaries.sh _site/agent/bin
          (
            cd _site/agent
            sha256sum bin/gesta-agent-* > SHA256SUMS
          )

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
